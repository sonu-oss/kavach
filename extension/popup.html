<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kavach Shield</title>
  <style>
    body { width: 330px; margin: 0; padding: 14px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0c0e12; color: #f3f4f6; }
    h1 { font-size: 15px; margin: 0 0 4px; display: flex; align-items: center; gap: 8px; font-weight: 700; color: #fff; }
    p { font-size: 12px; color: #9ca3af; margin: 0 0 10px; line-height: 1.4; }
    
    .status-card { background: #181b21; border: 1px solid #27272a; border-radius: 8px; padding: 9px 12px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .status-left { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 600; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #10b981; }
    .dot.off { background: #6b7280; }
    .switch { position: relative; display: inline-block; width: 34px; height: 20px; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #374151; transition: .3s; border-radius: 20px; }
    .slider:before { position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px; background-color: white; transition: .3s; border-radius: 50%; }
    input:checked + .slider { background-color: #10b981; }
    input:checked + .slider:before { transform: translateX(14px); }

    .pairing-card {
      background: rgba(30, 27, 46, 0.65);
      border: 1px solid rgba(168, 85, 247, 0.28);
      border-radius: 10px;
      padding: 10px 12px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pairing-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 6px;
    }
    .pairing-badge {
      font-size: 10.5px;
      font-weight: 700;
      color: #c084fc;
      letter-spacing: 0.06em;
    }
    .pairing-indicator {
      font-size: 9.5px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #34d399;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 700;
    }
    .pairing-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11.5px;
      gap: 8px;
    }
    .pairing-label { color: #94a3b8; font-weight: 500; }
    .pairing-val { color: #f1f5f9; font-weight: 600; text-align: right; max-width: 190px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    .stat-row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 6px; color: #d1d5db; }
    .btn { display: block; text-align: center; background: #6366f1; color: #fff; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 12.5px; font-weight: 600; margin-top: 8px; cursor: pointer; border: none; width: 100%; box-sizing: border-box; }
    .btn:hover { background: #4f46e5; }
    .btn-secondary { background: #27272a; border: 1px solid #3f3f46; color: #e4e4e7; }
    .btn-secondary:hover { background: #3f3f46; }
  </style>
</head>
<body>
  <h1>🛡️ Kavach Live Shield</h1>
  <p>Real-time automated chat protection on WhatsApp Web and Telegram.</p>

  <div class="status-card">
    <div class="status-left">
      <span class="dot" id="live-dot"></span>
      <span id="live-text">Shield Active</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle-shield" checked />
      <span class="slider"></span>
    </label>
  </div>

  <!-- Device & Identity Pairing Status Card -->
  <div class="pairing-card">
    <div class="pairing-header">
      <span class="pairing-badge">🔒 DEVICE PAIRED</span>
      <span class="pairing-indicator">ACTIVE</span>
    </div>
    <div class="pairing-row">
      <span class="pairing-label">Kavach Account:</span>
      <strong id="user-status" class="pairing-val">Connecting...</strong>
    </div>
    <div class="pairing-row">
      <span class="pairing-label">WhatsApp Identity:</span>
      <strong id="wa-user-status" class="pairing-val">Linking...</strong>
    </div>
    <div class="pairing-row">
      <span class="pairing-label">Guardians Linked:</span>
      <strong id="guardians-status" class="pairing-val">Connecting...</strong>
    </div>
    <div class="pairing-row">
      <span class="pairing-label">Backend API:</span>
      <strong id="api-status" class="pairing-val" style="color:#10b981;">Online (Local API)</strong>
    </div>
  </div>

  <div class="stat-row">
    <span>Threats Flagged:</span>
    <strong id="threat-count">0</strong>
  </div>

  <button type="button" class="btn btn-secondary" id="test-banner-btn">⚡ Scan Active Chat Now</button>
  <a class="btn" id="open-kavach-btn" href="http://127.0.0.1:8000" target="_blank" rel="noopener">Open Kavach Safety Center ↗</a>

  <script src="popup.js"></script>
</body>
</html>

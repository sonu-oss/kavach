<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Open Kavach on your phone</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .wrap { max-width: 760px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
    h1 { margin: 0; font: 700 32px/1.1 var(--display); letter-spacing: -0.02em; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
    .card { border: 1px solid var(--border); border-radius: 14px; background: var(--surface); padding: 18px; display: flex; flex-direction: column; gap: 10px; align-items: center; text-align: center; }
    .card h2 { margin: 0; font-size: 17px; }
    .qr { background: #fff; padding: 10px; border-radius: 10px; width: 220px; }
    .qr svg { display: block; width: 100%; height: auto; }
    .link { font: 500 13px/1.4 ui-monospace, Menlo, monospace; word-break: break-all; color: var(--text); }
    ol { margin: 0; padding-left: 20px; color: var(--muted); line-height: 1.7; }
    .warn { color: var(--risk-high); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Open Kavach on your phone</h1>
    <div class="cards" id="cards"></div>
    <ol>
      <li>Scan a code with the iPhone camera and open it in <strong>Safari</strong>.</li>
      <li>Share → <strong>Add to Home Screen</strong>. Delete any older Kavach icon first: old links stop working.</li>
      <li>Keep the Mac on, plugged in, and the Start Kavach window open.</li>
    </ol>
  </div>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    (() => {
      const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const u = new URLSearchParams(location.search).get("u") || "";
      const cards = document.getElementById("cards");
      if (!/^https:\/\/[a-z0-9.-]+$/i.test(u)) {
        cards.innerHTML = `<p class="warn">No public link yet. Start Kavach with "Start Kavach" (or start-demo.sh).</p>`;
        return;
      }
      const qr = (text) => {
        try {
          const q = qrcode(0, "M");
          q.addData(text);
          q.make();
          return q.createSvgTag({ cellSize: 6, margin: 2, scalable: true });
        } catch {
          return "";
        }
      };
      cards.innerHTML = [
        ["Kavach app", u, "For her: Shield, Vault, Complaint, SOS"],
        ["Responder page", `${u}/responder.html`, "For volunteers who receive SOS alerts"],
      ]
        .map(([title, link, sub]) => `<div class="card"><h2>${title}</h2><span class="muted small">${sub}</span>
          <div class="qr">${qr(link)}</div><a class="link" href="${esc(link)}" target="_blank" rel="noopener">${esc(link)}</a></div>`)
        .join("");
    })();
  </script>
</body>
</html>

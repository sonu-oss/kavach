<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Kavach Live Location</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    .bar { padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
    .bar h1 { font-size: 17px; margin: 0; }
    .alert { background: var(--risk-high-bg); color: var(--risk-high); font-weight: 700; padding: 10px 16px; }
    .alert.safe { background: var(--risk-low-bg); color: var(--risk-low); }
    #map { flex: 1; min-height: 300px; }
    .actions { display: flex; gap: 8px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); flex-wrap: wrap; }
    .actions a { text-decoration: none; text-align: center; flex: 1; min-width: 140px; }
    .call112 { background: var(--risk-high); color: #fff; border-color: transparent; }
    .coords { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border); }
    .coords[hidden] { display: none; }
    .coords__text { flex: 1; min-width: 0; }
    .coords__text strong { display: block; font: 600 17px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .01em; user-select: all; }
    .coords__text small { color: var(--muted); }
  </style>
</head>
<body>
  <div class="bar">
    <h1>Live location shared with you by Kavach</h1>
    <span class="muted small" id="meta">Loading…</span>
  </div>
  <div class="alert" id="alert">She triggered an SOS and may need help.</div>
  <div class="coords" id="coords" hidden>
    <div class="coords__text">
      <small>Exact coordinates (latitude, longitude)</small>
      <strong id="coords-value">–</strong>
      <small id="coords-acc"></small>
    </div>
    <button type="button" class="btn" id="coords-copy">Copy</button>
  </div>
  <div id="map"></div>
  <div class="actions">
    <a class="btn call112" href="tel:112">Call 112</a>
    <a class="btn" id="directions" href="#" target="_blank" rel="noopener">Directions ↗</a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (() => {
      const token = new URLSearchParams(location.search).get("t") || "";
      const meta = document.getElementById("meta");
      const alertEl = document.getElementById("alert");
      const map = L.map("map", { zoomControl: true }).setView([20.6, 78.9], 4);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
      let pin = null, ring = null, first = true;

      async function refresh() {
        try {
          const res = await fetch(`/sos/track/${encodeURIComponent(token)}`);
          const d = await res.json();
          if (!res.ok) throw new Error(d.detail || "Link unavailable");
          if (d.status !== "active") {
            alertEl.textContent = "She marked herself safe. Location sharing has stopped.";
            alertEl.classList.add("safe");
            meta.textContent = `Ended ${new Date(d.updated_at).toLocaleString("en-IN")}`;
            document.getElementById("coords").hidden = true;
            pin && map.removeLayer(pin);
            ring && map.removeLayer(ring);
            return clearInterval(timer);
          }
          if (d.waiting_for_location) {
            if (d.name) document.querySelector(".bar h1").textContent = `${d.name} sent an SOS`;
            meta.textContent = "Her phone hasn't found her location yet. This page updates by itself. Try calling her.";
            return;
          }
          const ll = [d.lat, d.lng];
          // 6 decimals is about 10 cm: enough to read out to the police or paste into any maps app.
          const coords = `${d.lat.toFixed(6)}, ${d.lng.toFixed(6)}`;
          document.getElementById("coords").hidden = false;
          document.getElementById("coords-value").textContent = coords;
          document.getElementById("coords-acc").textContent = `Accurate to about ${Math.round(d.accuracy)} m · updates every few seconds`;
          pin ? pin.setLatLng(ll) : (pin = L.marker(ll).addTo(map));
          pin.bindPopup(`<strong>${coords}</strong><br>±${Math.round(d.accuracy)} m`);
          ring ? ring.setLatLng(ll).setRadius(d.accuracy) : (ring = L.circle(ll, { radius: d.accuracy, color: "#dc2f45" }).addTo(map));
          if (first) { map.setView(ll, 16); first = false; }
          if (d.name) document.querySelector(".bar h1").textContent = `${d.name}'s live location`;
          const help = d.responders_on_the_way.length ? ` · On the way: ${d.responders_on_the_way.join(", ")}` : "";
          meta.textContent = `SOS at ${new Date(d.created_at).toLocaleTimeString("en-IN")} · location ±${Math.round(d.accuracy)} m · updated ${new Date(d.updated_at).toLocaleTimeString("en-IN")}${help}`;
          // Google Maps directions open in the Maps app on iPhone and Android (from the viewer's own location).
          document.getElementById("directions").href = `https://www.google.com/maps/dir/?api=1&destination=${d.lat},${d.lng}`;
        } catch (err) {
          alertEl.textContent = err.message;
          meta.textContent = "";
          clearInterval(timer);
        }
      }
      document.getElementById("coords-copy").addEventListener("click", async (e) => {
        const text = document.getElementById("coords-value").textContent;
        try {
          await navigator.clipboard.writeText(text);
          e.target.textContent = "Copied ✓";
        } catch {
          e.target.textContent = "Select & copy";
        }
        setTimeout(() => (e.target.textContent = "Copy"), 2000);
      });
      const timer = setInterval(refresh, 5000);
      refresh();
    })();
  </script>
</body>
</html>

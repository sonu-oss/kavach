<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Kavach Live Location</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display: flex; flex-direction: column; height: 100vh; }
    .bar { padding: 14px 16px; background: var(--surface); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 4px; }
    .bar h1 { font-size: 17px; margin: 0; }
    .alert { background: var(--risk-high-bg); color: var(--risk-high); font-weight: 700; padding: 10px 16px; }
    .alert.safe { background: var(--risk-low-bg); color: var(--risk-low); }
    #map { flex: 1; min-height: 300px; }
    .actions { display: flex; gap: 8px; padding: 12px 16px; background: var(--surface); border-top: 1px solid var(--border); flex-wrap: wrap; }
    .actions a { text-decoration: none; text-align: center; flex: 1; min-width: 140px; }
    .call112 { background: var(--risk-high); color: #fff; border-color: transparent; }
  </style>
</head>
<body>
  <div class="bar">
    <h1>Live location shared with you by Kavach</h1>
    <span class="muted small" id="meta">Loading…</span>
  </div>
  <div class="alert" id="alert">She triggered an SOS and may need help.</div>
  <div id="map"></div>
  <div class="actions">
    <a class="btn call112" href="tel:112">Call 112 (police / emergency)</a>
    <a class="btn" id="directions" href="#" target="_blank" rel="noopener">Directions ↗</a>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (() => {
      const token = new URLSearchParams(location.search).get("t") || "";
      const meta = document.getElementById("meta");
      const alertEl = document.getElementById("alert");
      const map = L.map("map", { zoomControl: true }).setView([20.6, 78.9], 4);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 19, attribution: "&copy; OpenStreetMap contributors",
      }).addTo(map);
      let pin = null, ring = null, first = true;

      async function refresh() {
        try {
          const res = await fetch(`/sos/track/${encodeURIComponent(token)}`);
          const d = await res.json();
          if (!res.ok) throw new Error(d.detail || "Link unavailable");
          if (d.status !== "active") {
            alertEl.textContent = "She marked herself safe. Location sharing has stopped.";
            alertEl.classList.add("safe");
            meta.textContent = `Ended ${new Date(d.updated_at).toLocaleString("en-IN")}`;
            pin && map.removeLayer(pin);
            ring && map.removeLayer(ring);
            return clearInterval(timer);
          }
          const ll = [d.lat, d.lng];
          pin ? pin.setLatLng(ll) : (pin = L.marker(ll).addTo(map));
          ring ? ring.setLatLng(ll).setRadius(d.accuracy) : (ring = L.circle(ll, { radius: d.accuracy, color: "#dc2f45" }).addTo(map));
          if (first) { map.setView(ll, 16); first = false; }
          const help = d.responders_on_the_way.length ? ` · On the way: ${d.responders_on_the_way.join(", ")}` : "";
          meta.textContent = `SOS at ${new Date(d.created_at).toLocaleTimeString("en-IN")} · location ±${Math.round(d.accuracy)} m · updated ${new Date(d.updated_at).toLocaleTimeString("en-IN")}${help}`;
          document.getElementById("directions").href = `https://www.openstreetmap.org/directions?route=%3B${d.lat}%2C${d.lng}`;
        } catch (err) {
          alertEl.textContent = err.message;
          meta.textContent = "";
          clearInterval(timer);
        }
      }
      const timer = setInterval(refresh, 5000);
      refresh();
    })();
  </script>
</body>
</html>

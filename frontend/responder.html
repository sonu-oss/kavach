<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Kavach Responder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Inter+Tight:wght@600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { height: 100vh; display: grid; grid-template-columns: 380px 1fr; grid-template-rows: auto 1fr; }
    header.top { grid-column: 1 / -1; display: flex; align-items: center; gap: 12px; padding: 12px 16px; background: var(--bg); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    header.top h1 { margin: 0; font: 600 17px/1.2 var(--display); }
    header.top select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 7px 10px; color: var(--text); }
    aside { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--bg); border-right: 1px solid var(--border); }
    #map { min-height: 300px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
    .card.alert-card { cursor: pointer; }
    .card.selected { border-color: var(--brand); }
    .card h2 { margin: 0; font: 600 15px/1.2 var(--display); }
    .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; }
    .card .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .card label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
    .card input { background: var(--surface-2); border: 1px solid var(--border); border-radius: 4px; padding: 8px 10px; color: var(--text); }
    .accept { background: var(--risk-low); color: #0a0a0a; border-color: var(--risk-low); }
    .exact { font-size: 12.5px; background: var(--risk-low-bg); color: var(--risk-low); padding: 8px 10px; border-radius: 4px; }
    .exact a { color: inherit; font-weight: 700; }
    .privacy { font-size: 12px; color: var(--muted); border: 1px dashed var(--border); border-radius: 6px; padding: 10px 12px; }
    .chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip-ok { color: var(--risk-low); }
    .chip-wait { color: var(--risk-med); }
    .live { font: 500 11px/1 var(--mono); letter-spacing: .08em; color: var(--risk-low); margin-left: auto; }
    .live.off { color: var(--risk-med); }
    .new-alert { background: var(--risk-high); color: #fff; font: 600 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 10px 12px; border-radius: 4px; animation: pulse-bg 1s ease-in-out 3; }
    .new-alert[hidden] { display: none; }
    @keyframes pulse-bg { 50% { opacity: .6; } }
    .admin-row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 13px; }
    .card label.switch { flex-direction: row; align-items: center; gap: 8px; font-size: 13px; color: var(--text); cursor: pointer; }
    @media (max-width: 820px) {
      body { grid-template-columns: 1fr; grid-template-rows: auto auto 55vh; height: auto; }
      aside { border-right: none; }
      .live { margin-left: 0; }
    }
  </style>
</head>
<body>
  <header class="top">
    <h1>Kavach Responder</h1>
    <span class="live" id="live">Connecting…</span>
    <label class="small muted" id="who-wrap" hidden>Signed in as
      <select id="who"></select>
    </label>
  </header>
  <aside>
    <div class="new-alert" id="new-alert" hidden>New SOS nearby</div>
    <div id="me"></div>
    <div id="alerts"></div>
    <div id="admin"></div>
    <div class="privacy">You see an approximate area until you accept. Then her exact location is shared with <strong>you only</strong>.</div>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
  <script>
    (() => {
      const $ = (s) => document.querySelector(s);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const ME_KEY = "kavach.responderId";
      const map = L.map("map").setView([12.9352, 77.6245], 13);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
      const layer = L.layerGroup().addTo(map);
      // Leaflet measures its box once; re-measure after layout so no grey strip remains.
      setTimeout(() => map.invalidateSize(), 300);
      window.addEventListener("resize", () => map.invalidateSize());

      let responders = [], alerts = [], selected = null, me = null, lastKey = "", seen = null;
      let health = {}, bot = null;
      const live = $("#live");

      async function api(path, opts = {}) {
        const res = await fetch(path, { ...opts, headers: opts.body ? { "Content-Type": "application/json" } : undefined });
        const body = await res.json().catch(() => ({}));
        if (!res.ok) throw new Error(body.detail || `HTTP ${res.status}`);
        return body;
      }
      const store = {
        get: () => { try { return localStorage.getItem(ME_KEY); } catch { return null; } },
        set: (v) => { try { v ? localStorage.setItem(ME_KEY, v) : localStorage.removeItem(ME_KEY); } catch {} },
      };

      async function init() {
        try {
          health = await api("/health");
          bot = (await api("/sos/setup")).telegram.bot;
        } catch {
          $("#me").innerHTML = `<p class="note">Can't reach Kavach. Is the server running?</p>`;
          live.textContent = "Offline";
          return setTimeout(init, 3000);
        }
        me = new URLSearchParams(location.search).get("as") || store.get();
        await loadResponders();
        if (me && !responders.some((r) => r.id === me)) { me = null; store.set(null); }
        renderMe();
        refresh();
        setInterval(refresh, 3000);
        setInterval(loadResponders, 10000);
      }

      async function loadResponders() {
        responders = (await api("/responders")).responders;
        $("#who-wrap").hidden = !responders.length;
        $("#who").innerHTML = `<option value="">New responder…</option>` + responders.map((r) =>
          `<option value="${r.id}" ${r.id === me ? "selected" : ""}>${esc(r.name)}</option>`).join("");
        renderMe();
        renderAdmin();
      }

      $("#who").addEventListener("change", () => {
        me = $("#who").value || null;
        store.set(me);
        selected = null; seen = null; lastKey = "";
        renderMe();
        refresh();
      });

      // ---------- my profile / sign-up ----------
      function renderMe() {
        const r = responders.find((x) => x.id === me);
        if (!r) {
          $("#me").innerHTML = `<form class="card" id="signup">
            <h2>Become a responder</h2>
            <p class="note">Get alerts when someone nearby triggers an SOS. Your location is only used to check distance.</p>
            <label>Name<input name="name" required maxlength="60" autocomplete="off" /></label>
            <label>Email (backup alerts)<input name="email" type="email" maxlength="120" autocomplete="off" /></label>
            <button class="btn btn--primary" type="submit">Use my location and sign up</button>
          </form>`;
          $("#signup").addEventListener("submit", signup);
          return;
        }
        const tgLink = bot ? `https://t.me/${bot}?start=${r.link_code}` : null;
        $("#me").innerHTML = `<div class="card">
          <div class="row"><h2>${esc(r.name)}</h2><button type="button" class="btn btn--ghost small" id="signout">Switch</button></div>
          <div class="chips">
            <span class="chip ${r.verified ? "chip-ok" : "chip-wait"}">${r.verified ? "✓ Verified" : "Waiting for approval"}</span>
            <span class="chip ${r.telegram_linked ? "chip-ok" : "chip-wait"}">${r.telegram_linked ? "✓ Telegram" : "Telegram not connected"}</span>
            <span class="chip ${r.has_location ? "chip-ok" : "chip-wait"}">${r.has_location ? "✓ Location" : "No location"}</span>
          </div>
          <label class="switch"><input type="checkbox" id="optin" ${r.opted_in ? "checked" : ""} /> Receive SOS alerts</label>
          <div class="acts">
            <button type="button" class="btn" id="relocate">Update my location</button>
            ${!r.telegram_linked && tgLink ? `<button type="button" class="btn btn--primary" id="tg">Connect Telegram</button>` : `<span></span>`}
          </div>
          <div id="tg-box"></div>
          <button type="button" class="btn btn--ghost small" id="leave">Leave the network</button>
        </div>`;
        $("#signout").onclick = () => { me = null; store.set(null); $("#who").value = ""; renderMe(); refresh(); };
        $("#optin").onchange = async (e) => { await api(`/people/${r.id}`, { method: "PATCH", body: JSON.stringify({ opted_in: e.target.checked }) }); loadResponders(); };
        $("#relocate").onclick = async () => {
          try {
            const p = await locate();
            await api(`/people/${r.id}`, { method: "PATCH", body: JSON.stringify(p) });
            loadResponders();
          } catch (err) { alert(err.message); }
        };
        $("#leave").onclick = async () => {
          if (!confirm("Leave the responder network? Your name, location and alerts are deleted.")) return;
          try {
            await api(`/people/${r.id}`, { method: "DELETE" });
          } catch (err) { return alert(err.message); }
          me = null; store.set(null);
          await loadResponders();
          refresh();
        };
        const tg = $("#tg");
        if (tg) tg.onclick = () => showTelegram(tgLink);
      }

      function showTelegram(link) {
        let svg = "";
        try { const q = qrcode(0, "M"); q.addData(link); q.make(); svg = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }); } catch {}
        $("#tg-box").innerHTML = `<div class="qr">${svg}</div>
          <p class="note">On this phone, <a href="${esc(link)}" target="_blank" rel="noopener">open Telegram</a> and tap <strong>Start</strong>. On a laptop, scan the code with your phone.</p>`;
      }

      function locate() {
        return new Promise((resolve, reject) => {
          if (!navigator.geolocation) return reject(new Error("Location isn't available in this browser."));
          navigator.geolocation.getCurrentPosition(
            (p) => resolve({ lat: p.coords.latitude, lng: p.coords.longitude }),
            (e) => reject(new Error(`Couldn't get your location: ${e.message}`)),
            { enableHighAccuracy: true, timeout: 10000 }
          );
        });
      }

      async function signup(e) {
        e.preventDefault();
        const f = new FormData(e.target);
        const btn = e.target.querySelector("button");
        btn.disabled = true; btn.textContent = "Getting your location…";
        try {
          const loc = await locate().catch(() => ({ lat: null, lng: null }));
          const p = await api("/people", { method: "POST", body: JSON.stringify({
            kind: "responder", name: f.get("name"), email: f.get("email") || "", lat: loc.lat, lng: loc.lng }) });
          me = p.id; store.set(me);
          await loadResponders();
          if (p.telegram_link) showTelegram(p.telegram_link);
        } catch (err) {
          alert(`Sign-up failed: ${err.message}`);
          btn.disabled = false; btn.textContent = "Use my location and sign up";
        }
      }

      // ---------- admin approval (demo mode) ----------
      function renderAdmin() {
        const pending = responders.filter((r) => !r.verified);
        if (!health.demo_mode || !responders.length) { $("#admin").innerHTML = ""; return; }
        $("#admin").innerHTML = `<div class="card">
          <p class="section-title">Approve responders <span class="muted">(admin)</span></p>
          ${pending.length ? pending.map((r) => `<div class="admin-row"><span>${esc(r.name)}${r.has_location ? "" : " · no location"}</span>
            <button type="button" class="btn small" data-approve="${r.id}">Approve</button></div>`).join("")
            : `<p class="note">Everyone is verified.</p>`}
        </div>`;
      }
      $("#admin").addEventListener("click", async (e) => {
        const b = e.target.closest("[data-approve]");
        if (!b) return;
        b.disabled = true;
        await api(`/people/${b.dataset.approve}/verify`, { method: "POST" }).catch(() => {});
        loadResponders();
      });

      // ---------- alerts ----------
      async function refresh() {
        if (!me) { $("#alerts").innerHTML = ""; layer.clearLayers(); live.textContent = "● Live"; return; }
        try {
          alerts = (await api(`/responders/${me}/alerts`)).alerts;
          live.textContent = `● Live · checked ${new Date().toLocaleTimeString("en-GB")}`;
          live.classList.remove("off");
        } catch {
          live.textContent = "Offline · retrying";
          live.classList.add("off");
          return;
        }
        const fresh = alerts.filter((a) => seen && !seen.has(a.sos_id));
        seen = new Set(alerts.map((a) => a.sos_id));
        if (fresh.length) {
          selected = fresh[0].sos_id;
          $("#new-alert").hidden = false;
          document.title = "● New SOS · Kavach Responder";
          navigator.vibrate?.([200, 100, 200]);
          setTimeout(() => { $("#new-alert").hidden = true; document.title = "Kavach Responder"; }, 8000);
        }
        if (!alerts.some((a) => a.sos_id === selected)) selected = alerts[0]?.sos_id || null;
        const key = JSON.stringify(alerts);
        if (key === lastKey) return;
        lastKey = key;
        render();
      }

      function render() {
        if (!alerts.length) {
          $("#alerts").innerHTML = `<p class="note">No alerts yet. Waiting for an SOS nearby…</p>`;
          layer.clearLayers();
          return;
        }
        $("#alerts").innerHTML = alerts.map((a) => {
          const ended = a.sos_status !== "active";
          const from = a.my_position ? `${a.my_position.lat},${a.my_position.lng}` : "";
          const exact = a.exact
            ? `<div class="exact">Exact location shared with you only.<br><a href="https://www.google.com/maps/dir/?api=1${from ? `&origin=${from}` : ""}&destination=${a.exact.lat},${a.exact.lng}" target="_blank" rel="noopener">Get directions ↗</a></div>` : "";
          const updated = !ended && a.updated_at && a.updated_at !== a.created_at
            ? `<div class="row muted">Location updated ${new Date(a.updated_at).toLocaleTimeString("en-IN")}</div>` : "";
          const acts = ended ? `<p class="note">${a.sos_status === "expired" ? "Alert expired." : "She marked herself safe. Thank you."}</p>`
            : a.my_status === "pending" ? `<div class="acts"><button class="btn accept" data-act="accept" data-id="${a.sos_id}">Accept</button><button class="btn" data-act="decline" data-id="${a.sos_id}">Decline</button></div>`
            : a.my_status === "declined" ? `<p class="note">You declined this alert.</p>` : "";
          return `<div class="card alert-card ${a.sos_id === selected ? "selected" : ""}" data-sel="${a.sos_id}">
            <div class="row"><h2>SOS nearby</h2><span class="state ${ended ? "excluded" : a.my_status}">${ended ? "ended" : a.my_status}</span></div>
            <div class="row"><span>${new Date(a.created_at).toLocaleTimeString("en-IN")}</span><span>${a.approx_distance_km ?? "?"} km from you</span></div>
            ${a.others_accepted ? `<div class="row muted">${a.others_accepted} other responder(s) on the way</div>` : ""}
            ${updated}${exact}${acts}
          </div>`;
        }).join("");
        drawMap();
      }

      function drawMap() {
        layer.clearLayers();
        const a = alerts.find((x) => x.sos_id === selected);
        if (!a) return;
        const pts = [];
        if (a.my_position) {
          const mine = [a.my_position.lat, a.my_position.lng];
          L.circleMarker(mine, { radius: 7, color: "#ffd400", fillOpacity: 1 }).bindTooltip("You").addTo(layer);
          pts.push(mine);
        }
        if (a.exact && a.sos_status === "active") {
          const her = [a.exact.lat, a.exact.lng];
          L.marker(her).bindTooltip("Her exact location").addTo(layer);
          if (pts.length) L.polyline([pts[0], her], { color: "#3ecf8e", dashArray: "6 6" }).addTo(layer);
          pts.push(her);
        } else {
          const c = [a.approx_area.lat, a.approx_area.lng];
          L.circle(c, { radius: a.approx_area.radius_m, color: "#f5a524", dashArray: "6 6", fillOpacity: 0.12 })
            .bindTooltip("Approximate area (exact location after you accept)").addTo(layer);
          pts.push(c);
        }
        map.invalidateSize();
        pts.length > 1 ? map.fitBounds(L.latLngBounds(pts).pad(0.4)) : map.setView(pts[0], 14);
      }

      $("#alerts").addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]");
        if (btn) {
          btn.disabled = true;
          await api(`/sos/${btn.dataset.id}/respond`, { method: "POST", body: JSON.stringify({ responder_id: me, action: btn.dataset.act }) }).catch((err) => alert(err.message));
          lastKey = "";
          return refresh();
        }
        const card = e.target.closest("[data-sel]");
        if (card) { selected = card.dataset.sel; render(); }
      });

      init();
    })();
  </script>
</body>
</html>

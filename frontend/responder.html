<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Kavach Responder</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { height: 100vh; display: grid; grid-template-columns: 360px 1fr; grid-template-rows: auto 1fr; }
    header.top { grid-column: 1 / -1; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
    header.top h1 { margin: 0; font-size: 17px; }
    header.top select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; color: var(--text); }
    aside { overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface-2); border-right: 1px solid var(--border); }
    #map { min-height: 300px; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 8px; cursor: pointer; }
    .card.selected { border-color: var(--brand); box-shadow: 0 0 0 3px color-mix(in srgb, var(--brand) 18%, transparent); }
    .card h2 { margin: 0; font-size: 15px; }
    .card .row { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12.5px; }
    .card .acts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .accept { background: var(--risk-low); color: #fff; border-color: transparent; }
    .exact { font-size: 12.5px; background: var(--risk-low-bg); color: var(--risk-low); padding: 8px 10px; border-radius: 8px; }
    .exact a { color: inherit; font-weight: 700; }
    .live { font: 500 11px/1 var(--mono); letter-spacing: .08em; color: var(--risk-low); margin-left: auto; }
    .live.off { color: var(--risk-med); }
    .new-alert { background: var(--risk-high); color: #fff; font: 600 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; padding: 10px 12px; border-radius: 4px; animation: pulse-bg 1s ease-in-out 3; }
    .new-alert[hidden] { display: none; }
    @keyframes pulse-bg { 50% { opacity: .6; } }
    .privacy { font-size: 12px; color: var(--muted); background: var(--surface); border: 1px dashed var(--border); border-radius: 10px; padding: 10px 12px; }
    @media (max-width: 820px) { body { grid-template-columns: 1fr; grid-template-rows: auto auto 60vh; } aside { border-right: none; } }
  </style>
</head>
<body>
  <header class="top">
    <div>
      <h1>Kavach Responder Network</h1>
      <span class="muted small">Prototype dashboard · mock responders</span>
    </div>
    <span class="live" id="live">Connecting…</span>
    <label class="small muted">Signed in as
      <select id="who"></select>
    </label>
  </header>
  <aside>
    <div class="new-alert" id="new-alert" hidden>New SOS nearby</div>
    <div class="privacy">Approximate area until you accept. Then her exact location is shared with <strong>you only</strong>.</div>
    <div id="alerts"><p class="note">Loading…</p></div>
  </aside>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    (() => {
      const $ = (s) => document.querySelector(s);
      const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
      const map = L.map("map").setView([12.9352, 77.6245], 13);
      L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19, attribution: "&copy; OpenStreetMap contributors" }).addTo(map);
      const layer = L.layerGroup().addTo(map);
      let responders = [], alerts = [], selected = null, me = null, lastKey = "";
      let seen = null; // SOS ids this responder has already been shown
      const live = $("#live");

      async function init() {
        let d;
        try {
          d = await (await fetch("/responders")).json();
        } catch {
          $("#alerts").innerHTML = `<p class="note">Can't reach Kavach. Is the server running?</p>`;
          live.textContent = "Offline";
          return setTimeout(init, 3000);
        }
        responders = d.responders;
        const saved = new URLSearchParams(location.search).get("as");
        $("#who").innerHTML = responders.map((r) =>
          `<option value="${r.id}">${esc(r.name)}${r.verified ? "" : " (unverified)"}${r.opted_in ? "" : " (alerts off)"}</option>`).join("");
        if (saved) $("#who").value = saved;
        me = $("#who").value;
        $("#who").addEventListener("change", () => { me = $("#who").value; selected = null; seen = null; lastKey = ""; refresh(); });
        refresh();
        setInterval(refresh, 3000);
      }

      async function refresh() {
        try {
          const d = await (await fetch(`/responders/${me}/alerts`)).json();
          alerts = d.alerts;
          live.textContent = `● Live · checked ${new Date().toLocaleTimeString("en-GB")}`;
          live.classList.remove("off");
        } catch {
          live.textContent = "Offline · retrying";
          live.classList.add("off");
          return;
        }
        // A new SOS jumps to the top of her attention: select it and flag it.
        const fresh = alerts.filter((a) => seen && !seen.has(a.sos_id));
        seen = new Set(alerts.map((a) => a.sos_id));
        if (fresh.length) {
          selected = fresh[0].sos_id;
          $("#new-alert").hidden = false;
          document.title = "● New SOS · Kavach Responder";
          setTimeout(() => { $("#new-alert").hidden = true; document.title = "Kavach Responder"; }, 8000);
        }
        if (!alerts.some((a) => a.sos_id === selected)) selected = alerts[0]?.sos_id || null;
        const key = JSON.stringify(alerts);
        if (key === lastKey) return;
        lastKey = key;
        render();
      }

      function render() {
        const r = responders.find((x) => x.id === me);
        if (!alerts.length) {
          $("#alerts").innerHTML = `<p class="note">${!r.verified ? "Not verified: this account never gets alerts." : !r.opted_in ? "Alerts are turned off for this account." : "No alerts yet. Waiting for an SOS nearby…"}</p>`;
          layer.clearLayers();
          return;
        }
        $("#alerts").innerHTML = alerts.map((a) => {
          const ended = a.sos_status !== "active";
          const exact = a.exact
            ? `<div class="exact">Exact location shared with you only.<br><a href="https://www.openstreetmap.org/directions?route=${a.my_position.lat}%2C${a.my_position.lng}%3B${a.exact.lat}%2C${a.exact.lng}" target="_blank" rel="noopener">Get directions ↗</a></div>` : "";
          const updated = !ended && a.updated_at && a.updated_at !== a.created_at
            ? `<div class="row muted">Location updated ${new Date(a.updated_at).toLocaleTimeString("en-IN")}</div>` : "";
          const acts = ended ? `<p class="note">${a.sos_status === "expired" ? "Alert expired." : "She marked herself safe. Thank you."}</p>`
            : a.my_status === "pending" ? `<div class="acts"><button class="btn accept" data-act="accept" data-id="${a.sos_id}">Accept</button><button class="btn" data-act="decline" data-id="${a.sos_id}">Decline</button></div>`
            : a.my_status === "declined" ? `<p class="note">You declined this alert.</p>` : "";
          return `<div class="card ${a.sos_id === selected ? "selected" : ""}" data-sel="${a.sos_id}">
            <div class="row"><h2>SOS nearby</h2><span class="state ${ended ? "excluded" : a.my_status}">${ended ? "ended" : a.my_status}</span></div>
            <div class="row"><span>${new Date(a.created_at).toLocaleTimeString("en-IN")}</span><span>~${a.approx_distance_km} km from you</span></div>
            ${a.others_accepted ? `<div class="row muted">${a.others_accepted} other responder(s) on the way</div>` : ""}
            ${updated}${exact}${acts}
          </div>`;
        }).join("");
        drawMap();
      }

      function drawMap() {
        layer.clearLayers();
        const a = alerts.find((x) => x.sos_id === selected);
        if (!a) return;
        const mine = [a.my_position.lat, a.my_position.lng];
        L.circleMarker(mine, { radius: 7, color: "#ffd400", fillOpacity: 1 }).bindTooltip("You").addTo(layer);
        if (a.exact && a.sos_status === "active") {
          const her = [a.exact.lat, a.exact.lng];
          L.marker(her).bindTooltip("Her exact location").addTo(layer);
          L.polyline([mine, her], { color: "#16a36a", dashArray: "6 6" }).addTo(layer);
          map.fitBounds(L.latLngBounds([mine, her]).pad(0.3));
        } else {
          const c = [a.approx_area.lat, a.approx_area.lng];
          L.circle(c, { radius: a.approx_area.radius_m, color: "#d98a00", dashArray: "6 6", fillOpacity: 0.12 })
            .bindTooltip("Approximate area (exact location after you accept)").addTo(layer);
          map.fitBounds(L.latLngBounds([mine, c]).pad(0.5));
        }
      }

      $("#alerts").addEventListener("click", async (e) => {
        const btn = e.target.closest("[data-act]");
        if (btn) {
          btn.disabled = true;
          await fetch(`/sos/${btn.dataset.id}/respond`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ responder_id: me, action: btn.dataset.act }),
          });
          lastKey = "";
          return refresh();
        }
        const card = e.target.closest("[data-sel]");
        if (card) { selected = card.dataset.sel; render(); }
      });

      init();
    })();
  </script>
</body>
</html>

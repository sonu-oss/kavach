<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>404 — Page Not Found · Kavach 1.0</title>
  <link rel="icon" href="/assets/icons/icon-192.png" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    body {
      background: #09090d; color: #f4ede4; font-family: "DM Sans", -apple-system, sans-serif;
      display: grid; place-items: center; min-height: 100vh; margin: 0; padding: 20px; text-align: center;
    }
    .box {
      max-width: 480px; padding: 40px 32px; border-radius: 20px;
      background: #121218; border: 1px solid rgba(255, 255, 255, .1);
      box-shadow: 0 20px 50px rgba(0, 0, 0, .6);
    }
    .code { font: 700 72px/1 "JetBrains Mono", monospace; color: #f26888; margin-bottom: 12px; }
    h1 { font-size: 22px; margin-bottom: 10px; color: #fff; }
    p { font-size: 14px; color: #95908b; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-block; padding: 12px 24px; border-radius: 12px; background: #f26888;
      color: #fff; text-decoration: none; font-weight: 600; font-size: 14px;
      transition: transform .15s, background .15s;
    }
    .btn:hover { background: #ff7d9c; transform: translateY(-1px); }
  </style>
</head>
<body>
  <div class="box">
    <div class="code">404</div>
    <h1>Safety Perimeter Intact</h1>
    <p>The page or resource you requested does not exist or has been moved. Your Kavach safety protection remains active.</p>
    <a href="/" class="btn">Return to Safety Dashboard →</a>
  </div>
</body>
</html>
